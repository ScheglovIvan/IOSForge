<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}IOSForge Admin{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js"></script>
  {% block head %}{% endblock %}
</head>
<body{% if user and user.csrf_token %} data-csrf="{{ user.csrf_token }}"{% endif %}>
{% if user %}
{% set path = request.url.path if request else '' %}
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="logo">iF</span> <span>IOSForge<br><small>pipeline admin</small></span></div>
    <nav class="nav">
      <a href="/jobs" class="{{ 'active' if path == '/jobs' or path.startswith('/jobs/') and not path.endswith('/new') else '' }}"><span class="ico">▦</span> Jobs</a>
      <a href="/jobs/new" class="{{ 'active' if path.endswith('/new') else '' }}"><span class="ico">＋</span> New job</a>
    </nav>
    <div class="spacer"></div>
    <div class="who">Signed in as <strong>{{ user.username }}</strong></div>
  </aside>
  <div class="main">
    <div class="topbar">
      <div class="crumbs">{% block crumbs %}{% endblock %}</div>
      <div class="actions">
        <button class="icon-btn theme-toggle" data-theme-toggle type="button" aria-label="Toggle theme"><span class="sun">☀</span><span class="moon">☾</span></button>
        <form method="post" action="/logout" style="margin:0">
          <input type="hidden" name="csrf_token" value="{{ user.csrf_token }}">
          <button class="btn btn--ghost btn--sm" type="submit">Logout</button>
        </form>
      </div>
    </div>
    <div class="content">
      {% block content %}{% endblock %}
    </div>
  </div>
</div>
{% else %}
<div class="auth">
  {{ self.content() }}
</div>
{% endif %}
</body>
</html>
