{% extends "base.html" %}
{% block title %}Sign in · IOSForge{% endblock %}
{% block content %}
<div class="card">
  <div class="brand"><span class="logo">iF</span> <span>IOSForge<br><small>pipeline admin</small></span></div>
  <h2 style="margin-top:6px;">Sign in</h2>
  {% if error %}<div class="alert alert--danger">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="field">
      <label for="u">Username</label>
      <input id="u" type="text" name="username" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="p">Password</label>
      <input id="p" type="password" name="password" autocomplete="current-password" required>
    </div>
    <button class="btn" type="submit" style="width:100%;">Log in</button>
  </form>
</div>
{% endblock %}
