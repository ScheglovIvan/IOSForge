# IOSForge — local infrastructure (SPEC §8): PostgreSQL + Redis + MinIO.
# T-1.2. Variables are read from .env (gitignored) with safe DEV defaults so the
# stack also boots from .env.example values. NO real secrets live here.
#
# Quick start:
#   cp .env.example .env        # adjust if needed
#   docker compose up -d
#   docker compose ps           # wait until all services are healthy
# Host ports: Postgres 5440, Redis 6379, MinIO API 9010 / console 9001 (override in .env).
# See docs/local-setup-mac.md (Mac) and docs/local-infra.md.

services:
  postgres:
    image: postgres:16
    container_name: iosforge-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iosforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iosforge}
      POSTGRES_DB: ${POSTGRES_DB:-iosforge}
    ports:
      - "${POSTGRES_PORT:-5440}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iosforge} -d ${POSTGRES_DB:-iosforge}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: iosforge-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  minio:
    # MinIO no longer publishes images on Docker Hub or quay.io (pulls are denied), so the
    # stack uses Chainguard's free MinIO build. It runs as root so volumes created by the
    # old minio/minio image (root-owned /data) keep working.
    image: cgr.dev/chainguard/minio:latest
    container_name: iosforge-minio
    user: root
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      # Root credentials reuse the app S3 keys for a single source of truth locally.
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-iosforge-dev}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-iosforge-dev-secret}
    ports:
      - "${MINIO_API_PORT:-9010}:9000"      # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001"  # Web console
    volumes:
      - minio-data:/data
    healthcheck:
      # The image has bash but no curl/mc: probe the liveness endpoint over /dev/tcp.
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /minio/health/live HTTP/1.0\r\n\r\n' >&3 && read -r status <&3 && [[ $$status == *" 200 "* ]]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    restart: unless-stopped

  # One-shot init: waits for MinIO, then ensures the versioned artifacts bucket exists.
  # Exits 0 once the bucket is present; safe to re-run (idempotent). The client image has
  # no shell, so the alias comes from MC_HOST_local and the bucket is made in one command.
  minio-init:
    image: cgr.dev/chainguard/minio-client:latest
    container_name: iosforge-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://${S3_ACCESS_KEY_ID:-iosforge-dev}:${S3_SECRET_ACCESS_KEY:-iosforge-dev-secret}@minio:9000
    command: ["mb", "--ignore-existing", "--with-versioning", "local/${S3_BUCKET:-iosforge-artifacts}"]
    restart: "no"

volumes:
  postgres-data:
  redis-data:
  minio-data:
