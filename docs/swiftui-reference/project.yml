name: Spike
options:
  bundleIdPrefix: com.iosforge.spike
  deploymentTarget:
    iOS: "17.0"
targets:
  Spike:
    type: application
    platform: iOS
    sources: [Spike]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iosforge.spike
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: Spike/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.iosforge.spike
            CFBundleURLSchemes: [iosforge]
        UILaunchScreen: {}
