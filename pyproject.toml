[project]
name = "iosforge"
version = "0.1.0"
description = "iOS application build & delivery pipeline (discovery / acquisition / walkthrough / codegen / delivery)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "celery[redis]",
    "sqlalchemy>=2",
    "alembic",
    "jinja2",
    "python-multipart",
    "structlog",
    "boto3",
    "psycopg[binary]>=3.3.4",
    "argon2-cffi>=25.1.0",
    "itsdangerous>=2.2.0",
    "redis>=6.4.0",
    "pyaxmlparser>=0.3.31",
    "jsonschema>=4.26.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
    "mypy",
    "types-jsonschema>=4.26.0.20260518",
    "types-pyyaml>=6.0.12.20260518",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["iosforge"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# FastAPI's dependency-injection idiom puts Depends()/Form()/File() in defaults;
# these are the documented pattern, not the B008 mutable-default footgun.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form", "fastapi.File", "fastapi.Query"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["iosforge"]

# Admin/worker (Jinja/HTMX + Celery/adb glue) are allowed to be looser than the domain core.
[[tool.mypy.overrides]]
module = ["iosforge.admin.*", "iosforge.worker.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false  # celery_app.task / FastAPI decorators are untyped

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
package = true
